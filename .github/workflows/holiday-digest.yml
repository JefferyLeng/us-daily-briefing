name: Holiday Digest

on:
  workflow_dispatch:
    inputs:
      force:
        description: '跳过假期判定强制运行（测试用）'
        required: false
        default: 'false'
        type: boolean

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run holiday digest
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 -c "
          import json, os
          cfg = {}
          if os.path.exists('config.json'):
              with open('config.json', 'r') as f:
                  cfg = json.load(f)
          cfg['feishu_webhook_url'] = os.environ['FEISHU_WEBHOOK_URL']
          cfg['deepseek_api_key'] = os.environ['DEEPSEEK_API_KEY']
          with open('config.json', 'w') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          "
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 holiday_digest.py --force
          else
            python3 holiday_digest.py
          fi
